# RaftVec cluster: 2 shards x 3 Raft replicas + aggregator + Prometheus +
# Grafana.
#
#   docker compose up -d              # pulls prebuilt images from GHCR
#   docker compose up -d --build      # builds locally instead (dev loop)
#   docker compose run --rm vecctl --addr http://aggregator:50060 \
#       create-collection --collection docs --dim 384 --shard-count 2
#
#   ./chaos/chaos.sh --kill-leader shard0   # kill a shard leader
#   ./chaos/audit.sh --file corpus.jsonl    # verify nothing was lost
#
#   Grafana:    http://localhost:3000  (anonymous, dashboard auto-loaded)
#   Prometheus: http://localhost:9090
#
# Shard replica gRPC ports are published to distinct host ports (5100x /
# 5101x) so the chaos scripts can probe leadership from the host. Exactly
# one replica per shard passes --bootstrap to propose the initial
# membership config.
services:
  shard0-r1:
    image: ghcr.io/hiepnnguyentcu/raftvec-node:latest
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "1"
      - "--bootstrap"
      - "--peers"
      - "1=shard0-r1:50051,2=shard0-r2:50051,3=shard0-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    ports:
      - "51001:50051"
    expose: ["9100"]

  shard0-r2:
    image: ghcr.io/hiepnnguyentcu/raftvec-node:latest
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "2"
      - "--peers"
      - "1=shard0-r1:50051,2=shard0-r2:50051,3=shard0-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    ports:
      - "51002:50051"
    expose: ["9100"]

  shard0-r3:
    image: ghcr.io/hiepnnguyentcu/raftvec-node:latest
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "3"
      - "--peers"
      - "1=shard0-r1:50051,2=shard0-r2:50051,3=shard0-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    ports:
      - "51003:50051"
    expose: ["9100"]

  shard1-r1:
    image: ghcr.io/hiepnnguyentcu/raftvec-node:latest
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "1"
      - "--bootstrap"
      - "--peers"
      - "1=shard1-r1:50051,2=shard1-r2:50051,3=shard1-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    ports:
      - "51011:50051"
    expose: ["9100"]

  shard1-r2:
    image: ghcr.io/hiepnnguyentcu/raftvec-node:latest
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "2"
      - "--peers"
      - "1=shard1-r1:50051,2=shard1-r2:50051,3=shard1-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    ports:
      - "51012:50051"
    expose: ["9100"]

  shard1-r3:
    image: ghcr.io/hiepnnguyentcu/raftvec-node:latest
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "3"
      - "--peers"
      - "1=shard1-r1:50051,2=shard1-r2:50051,3=shard1-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9100"
    ports:
      - "51013:50051"
    expose: ["9100"]

  aggregator:
    image: ghcr.io/hiepnnguyentcu/raftvec-aggregator:latest
    build: { context: ., dockerfile: Dockerfile, target: aggregator }
    command:
      - "--listen"
      - "0.0.0.0:50060"
      - "--shard"
      - "shard0-r1:50051,shard0-r2:50051,shard0-r3:50051"
      - "--shard"
      - "shard1-r1:50051,shard1-r2:50051,shard1-r3:50051"
      - "--metrics-listen"
      - "0.0.0.0:9101"
    ports:
      - "50060:50060"
    expose: ["9101"]
    depends_on:
      - shard0-r1
      - shard0-r2
      - shard0-r3
      - shard1-r1
      - shard1-r2
      - shard1-r3

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./dashboards/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - aggregator

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
    volumes:
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/raftvec.json:/var/lib/grafana/dashboards/raftvec.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Not started by default (`docker compose up` skips profiled services).
  # Run one-off CLI commands against the cluster with:
  #   docker compose run --rm vecctl --addr http://aggregator:50060 <args>
  vecctl:
    image: ghcr.io/hiepnnguyentcu/raftvec-vecctl:latest
    build: { context: ., dockerfile: Dockerfile, target: vecctl }
    profiles: ["tools"]
    depends_on:
      - aggregator
