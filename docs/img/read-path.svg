<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <marker id="rp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="rp-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#586069"/>
    </marker>
  </defs>
  <rect width="900" height="545" rx="8" fill="#0d1117"/>

  <!-- lifelines -->
  <line x1="110" y1="60" x2="110" y2="500" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="340" y1="60" x2="340" y2="500" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="580" y1="60" x2="580" y2="500" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="800" y1="60" x2="800" y2="500" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- actor headers -->
  <rect x="50" y="20" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="110" y="45" text-anchor="middle" fill="#c9d1d9" font-size="14">vecctl</text>

  <rect x="260" y="20" width="160" height="40" rx="6" fill="#0f2438" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="340" y="45" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">aggregator</text>

  <rect x="500" y="20" width="160" height="40" rx="6" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="580" y="40" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">shard 0 leader</text>
  <text x="580" y="54" text-anchor="middle" fill="#8b949e" font-size="10">(any shard, parallel)</text>

  <rect x="730" y="20" width="140" height="40" rx="6" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="800" y="45" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">shard 1 leader</text>

  <!-- step 1 -->
  <line x1="110" y1="100" x2="336" y2="100" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rp-arrow)"/>
  <text x="225" y="92" text-anchor="middle" fill="#c9d1d9" font-size="12">1. Search(query_vector, k)</text>

  <!-- step 2: fan out to both shards in parallel -->
  <line x1="340" y1="140" x2="576" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rp-arrow)"/>
  <line x1="340" y1="140" x2="796" y2="140" stroke="#8b949e" stroke-width="1.5" marker-end="url(#rp-arrow)"/>
  <text x="470" y="132" text-anchor="middle" fill="#c9d1d9" font-size="12">2. gRPC Search — fan out to every shard's leader, in parallel, per-call timeout</text>

  <!-- step 3: self note at both leaders -->
  <text x="690" y="180" text-anchor="middle" fill="#8b949e" font-size="11">3. ensure_linearizable() — confirm a majority still recognizes this replica as leader</text>

  <!-- step 4: self note at both leaders -->
  <text x="690" y="215" text-anchor="middle" fill="#8b949e" font-size="11">4. brute-force cosine scan, rayon fold/reduce over cached norms → local top-k</text>

  <!-- step 5: return arrows -->
  <line x1="580" y1="255" x2="344" y2="255" stroke="#586069" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#rp-arrow-dim)"/>
  <line x1="800" y1="255" x2="344" y2="255" stroke="#586069" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#rp-arrow-dim)"/>
  <text x="470" y="247" text-anchor="middle" fill="#8b949e" font-size="12">5. local top-k — or dropped + shards_failed++ on timeout/error</text>

  <!-- step 6: self note at aggregator -->
  <text x="340" y="295" text-anchor="middle" fill="#8b949e" font-size="11">6. merge_top_k over the union of shard results</text>
  <text x="340" y="309" text-anchor="middle" fill="#8b949e" font-size="11">→ exact global top-k, re-truncated to k</text>

  <!-- step 7 -->
  <line x1="340" y1="345" x2="114" y2="345" stroke="#586069" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#rp-arrow-dim)"/>
  <text x="225" y="337" text-anchor="middle" fill="#8b949e" font-size="12">7. results + shards_failed</text>

  <!-- footer -->
  <rect x="60" y="400" width="780" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="425" text-anchor="middle" fill="#c9d1d9" font-size="12">Shards partition the corpus disjointly, so the union of per-shard top-k sets always</text>
  <text x="450" y="444" text-anchor="middle" fill="#c9d1d9" font-size="12">contains the true global top-k — merging by score loses nothing. A non-zero</text>
  <text x="450" y="463" text-anchor="middle" fill="#c9d1d9" font-size="12">shards_failed means the result is honest-but-incomplete, never silently wrong.</text>
</svg>
