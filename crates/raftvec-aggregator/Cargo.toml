[package]
name = "raftvec-aggregator"
version.workspace = true
edition.workspace = true

[lib]
name = "raftvec_aggregator"
path = "src/lib.rs"

[[bin]]
name = "raftvec-aggregator"
path = "src/main.rs"

[dependencies]
raftvec-core = { path = "../raftvec-core" }
raftvec-proto = { path = "../raftvec-proto" }
tokio = { workspace = true }
tonic = { workspace = true }
futures = "0.3"
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
raftvec-node = { path = "../raftvec-node" }
rand = "0.8"
tokio-stream = { version = "0.1", features = ["net"] }
