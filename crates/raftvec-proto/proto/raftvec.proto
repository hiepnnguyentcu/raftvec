syntax = "proto3";

package raftvec;

// M1: served directly by a standalone raftvec-node.
// M2+: this same contract is served by the aggregator, fanning out to shards.
service RaftVec {
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
}

message VectorRecord {
  uint64 id = 1;
  repeated float embedding = 2;
  map<string, string> metadata = 3;
}

message CreateCollectionRequest {
  string name = 1;
  uint32 dim = 2;
  uint32 shard_count = 3;
}

message CreateCollectionResponse {
  bool created = 1;
}

message InsertRequest {
  string collection = 1;
  repeated VectorRecord records = 2;
}

message InsertResponse {
  uint32 inserted = 1;
  // Set (non-empty) when this replica is not the shard's current Raft
  // leader and could not apply the write. Carries the current leader's
  // address, translated from openraft's NodeId by the replica itself, so
  // the aggregator never has to know about NodeIds -- just addresses to
  // retry against (technical design §4.2, §5.1).
  string leader_hint = 2;
}

message DeleteRequest {
  string collection = 1;
  repeated uint64 ids = 2;
}

message DeleteResponse {
  uint32 deleted = 1;
  string leader_hint = 2; // see InsertResponse.leader_hint
}

message SearchRequest {
  string collection = 1;
  repeated float query_vector = 2;
  uint32 k = 3;
}

message ScoredRecord {
  uint64 id = 1;
  float score = 2;
  map<string, string> metadata = 3;
}

message SearchResponse {
  repeated ScoredRecord results = 1;
  uint32 shards_queried = 2;
  uint32 shards_failed = 3;
  // Set when this replica is not the shard's current Raft leader (v1 reads
  // are leader-only, technical design §5.2, so NFR1's exact-equality
  // claim doesn't depend on follower staleness). See InsertResponse.leader_hint.
  string leader_hint = 4;
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
  repeated string collections = 1;
  uint32 vector_count = 2;
}

// Internal transport between replicas of the same shard's Raft group.
// openraft's request/response types are version-sensitive generics, so
// each RPC carries the bincode-serialized request/response as opaque
// bytes rather than hand-modeled proto messages. The contract here is "a
// Raft message got from A to B" — openraft owns the payload shape.
service ShardRaft {
  rpc AppendEntries(RaftMessage) returns (RaftMessage);
  rpc Vote(RaftMessage) returns (RaftMessage);
  rpc InstallSnapshot(RaftMessage) returns (RaftMessage);
}

message RaftMessage {
  bytes payload = 1;
}
