name: Release

# Triggered by pushing a tag like v0.1.0. Builds all three image targets
# and pushes them to GHCR tagged with both the release version and
# `latest`, then creates a GitHub Release. `docker-compose.yml` references
# these same image names, so `docker compose up -d` (no --build) pulls
# them instead of everyone rebuilding on every clone.

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  OWNER: hiepnnguyentcu

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: build + push ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [node, aggregator, vecctl]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/raftvec-${{ matrix.target }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/raftvec-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: create GitHub release
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with curated intro + auto-generated changelog
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file .github/release-notes-intro.md \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
