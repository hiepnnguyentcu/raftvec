# RaftVec cluster (M3): 2 shards, each a 3-node Raft group -- 6 shard
# replicas + 1 aggregator. Fixed at 2 shards x 3 replicas rather than 4x3
# (product spec §10 risk register: "12 containers overwhelm a laptop" ->
# "reduce to 2 shards x 3 replicas; the thesis holds identically").
#
#   docker compose up -d --build
#   docker compose run --rm vecctl --addr http://aggregator:50060 \
#       create-collection --collection docs --dim 384 --shard-count 2
#   docker compose run --rm vecctl --addr http://aggregator:50060 \
#       search --collection docs --query-vector 0.1,0.2,... -k 5
#
#   ./chaos/chaos.sh   -- kills a shard leader mid-load-test
#   ./chaos/audit.sh   -- verifies no lost/duplicated writes post-chaos
#
# Every node binds 0.0.0.0 inside its container (not the CLI's default
# 127.0.0.1) so peers and the aggregator, on different containers, can
# reach it over the compose network by service name. Only shard0-r1 and
# shard1-r1 pass --bootstrap: exactly one replica per shard proposes the
# initial membership config (technical design §6); the other two join as
# already-listed members once that succeeds.
services:
  shard0-r1:
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "1"
      - "--bootstrap"
      - "--peers"
      - "1=shard0-r1:50051,2=shard0-r2:50051,3=shard0-r3:50051"
    expose: ["50051"]

  shard0-r2:
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "2"
      - "--peers"
      - "1=shard0-r1:50051,2=shard0-r2:50051,3=shard0-r3:50051"
    expose: ["50051"]

  shard0-r3:
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "3"
      - "--peers"
      - "1=shard0-r1:50051,2=shard0-r2:50051,3=shard0-r3:50051"
    expose: ["50051"]

  shard1-r1:
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "1"
      - "--bootstrap"
      - "--peers"
      - "1=shard1-r1:50051,2=shard1-r2:50051,3=shard1-r3:50051"
    expose: ["50051"]

  shard1-r2:
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "2"
      - "--peers"
      - "1=shard1-r1:50051,2=shard1-r2:50051,3=shard1-r3:50051"
    expose: ["50051"]

  shard1-r3:
    build: { context: ., dockerfile: Dockerfile, target: node }
    command:
      - "--listen"
      - "0.0.0.0:50051"
      - "--node-id"
      - "3"
      - "--peers"
      - "1=shard1-r1:50051,2=shard1-r2:50051,3=shard1-r3:50051"
    expose: ["50051"]

  aggregator:
    build: { context: ., dockerfile: Dockerfile, target: aggregator }
    command:
      - "--listen"
      - "0.0.0.0:50060"
      - "--shard"
      - "shard0-r1:50051,shard0-r2:50051,shard0-r3:50051"
      - "--shard"
      - "shard1-r1:50051,shard1-r2:50051,shard1-r3:50051"
    ports:
      - "50060:50060"
    depends_on:
      - shard0-r1
      - shard0-r2
      - shard0-r3
      - shard1-r1
      - shard1-r2
      - shard1-r3

  # Not started by default (`docker compose up` skips profiled services).
  # Run one-off CLI commands against the cluster with:
  #   docker compose run --rm vecctl --addr http://aggregator:50060 <args>
  vecctl:
    build: { context: ., dockerfile: Dockerfile, target: vecctl }
    profiles: ["tools"]
    depends_on:
      - aggregator
